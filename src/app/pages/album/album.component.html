<div class="flex flex-col" style="height: 100%">
  <header>
    <div class="flex items-end bg-sky-900 rounded-t-lg">
      <div class="relative group flex ml-6 mb-6 mt-6">
        <button (click)="toggleEditCover()" [disabled]="editSongIndex != null || this.editName == true"
                class="absolute inset-0 flex cursor-pointer items-center justify-center text-white bg-gray-700 bg-opacity-50 opacity-0 group-hover:opacity-100 transition-opacity duration-200 disabled:text-slate-500 disabled:cursor-not-allowed">
          <lucide-icon name="pencil-line" class="pencil-line justify-center"></lucide-icon>
        </button>
        <img src="assets/images/{{this.album.image_url}}"
             class="w-48 h-48 max-w-full max-h-full lg:w-48 lg:h-48 md:w-32 md:h-32 sm:w-16 sm:h-16 object-cover bg-slate-800 cursor-pointer">
      </div>
      <div class="flex-1 pb-6 pl-4">
        <div>
          <h5 class="text-xl text-zinc-400">Album</h5>
          <div class="flex items-end gap-2 mr-2">
            <h1 *ngIf="!editName" class="text-4xl text-zinc-200">{{this.album.title}}</h1>
            <input *ngIf="editName" [(ngModel)]="this.album.title" size="10"
                   class="text-4xl rounded-md bg-gray-100 outline outline-offset-2 outline-1 outline-sky-600 border-0 pl-2 text-gray-900 placeholder:text-gray-400">
            <button *ngIf="!editName" (click)="editAlbumName()"
                    [hidden]="editSongIndex != null || this.editName == true"
                    class="no-underline text-zinc-200 bg-transparent border-none hover:text-sky-500 pb-1">
              <lucide-icon name="pencil-line" class="pencil-line pt-1"></lucide-icon>
            </button>
            <button *ngIf="editName" (click)="updateAlbum()"
                    [disabled]="this.album.title == null || this.album.title == ''"
                    class="no-underline text-green-500 bg-transparent border-none hover:text-green-700 pb-1 disabled:text-slate-500 disabled:cursor-not-allowed">
              <lucide-icon name="check" class="check pt-1"></lucide-icon>
            </button>
            <button *ngIf="editName" (click)="cancelEditAlbumName()"
                    class="no-underline text-red-500 bg-transparent border-none hover:text-red-700 pb-1">
              <lucide-icon name="x" class="x pt-1"></lucide-icon>
            </button>
          </div>
        </div>
      </div>

      <div class="flex pr-8 pb-8 gap-2">
        <button (click)="toggleAddMusic()"
                class="bg-sky-500 p-2 text-zinc-200 rounded-md border-none hover:bg-sky-700 disabled:bg-zinc-800 disabled:text-slate-500 disabled:cursor-not-allowed"
                [disabled]="editSongIndex != null || this.editName == true" type="button">
          <div class="flex items-center">
            <h4>Add New Song</h4>
          </div>
        </button>
        <button (click)="toggleDeleteAlbum()"
                class="bg-red-500 p-2 text-zinc-200 rounded-md border-none hover:bg-red-700 disabled:bg-zinc-800 disabled:text-slate-500 disabled:cursor-not-allowed"
                [disabled]="editSongIndex != null || this.editName == true" type="button">
          <div class="flex items-center">
            <h4>Delete Album</h4>
          </div>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-12 gap-4 pl-5 pr-5 pt-5">
      <div class="flex items-center col-span-9">
        <h4 class="pl-9 text-zinc-200">Music</h4>
      </div>
      <div class="flex items-center justify-center col-span-2">
        <h4 class="text-zinc-200">Song number</h4>
      </div>
      <div class="flex items-center col-span-1 justify-self-end pr-6">
        <h4 class="text-zinc-200">Edit</h4>
      </div>
    </div>

    <hr class="h-px mt-4 mb-4 bg-zinc-700 border-0">
  </header>

  <main class="flex-1 pl-5 pr-5 pb-2 overflow-y-auto">
    <div cdkDropListGroup>
      <div cdkDropList [cdkDropListData]="this.album.songs" (cdkDropListDropped)="drop($event)" class="drop-area">
        <div *ngFor="let song of album.songs; index as i;"
             class="grid grid-cols-12 gap-4 pt-2 pb-2 no-underline group hover:bg-sky-900 rounded-sm"
             cdkDragBoundary=".drop-area" cdkDragLockAxis="y" cdkDrag>
          <div class="flex items-center col-span-9">
            <div class="flex flex-row">
              <button cdkDragHandle [hidden]="editSongIndex != null || this.editName == true"
                      class="pl-1 cursor-move no-underline border-none bg-transparent text-zinc-400 hover:text-zinc-200 invisible group-hover:visible">
                <lucide-icon name="chevrons-up-down" class="chevrons-up-down" size="20"></lucide-icon>
              </button>
              <button (click)="playSong(song)" [hidden]="editSongIndex != null || this.editName == true"
                      class="pl-2 pr-2 cursor-pointer no-underline border-none bg-transparent text-zinc-400 hover:text-zinc-200 invisible group-hover:visible">
                <lucide-icon name="play" class="play" size="20"></lucide-icon>
              </button>
              <h4 *ngIf="editSongIndex !== i" class="pl-2 text-zinc-200">{{song.title}}</h4>
            </div>
            <div class="pl-9">
              <input *ngIf="editSongIndex === i" [(ngModel)]="song.title" size="40"
                     class="block w-full rounded-md bg-gray-100 outline outline-offset-2 outline-1 outline-sky-600 border-0 pl-2 text-gray-900 placeholder:text-gray-400"
                     placeholder="Song name">
            </div>
          </div>
          <div class="flex items-center justify-center col-span-2">
            <h4 *ngIf="song.song_number != 0 && editSongIndex !== i" class="text-zinc-200">{{song.song_number}}</h4>
            <input *ngIf="editSongIndex === i" [(ngModel)]="song.song_number" type="number"
                   class="flex rounded-md bg-gray-100 outline outline-offset-2 outline-1 outline-sky-600 border-0 pl-2 text-gray-900 placeholder:text-gray-400"
                   placeholder="Number">
          </div>
          <div class="flex items-center justify-self-end pr-2 pt-1 col-span-1 space-x-2">
            <button *ngIf="editSongIndex !== i" (click)="editSongDetails(i, song)"
                    [hidden]="editSongIndex != null || this.editName == true"
                    class="no-underline border-none bg-transparent text-zinc-200 hover:text-sky-500 invisible group-hover:visible">
              <lucide-icon name="pencil-line" class="pencil-line"></lucide-icon>
            </button>
            <button *ngIf="editSongIndex === i" (click)="updateSongDetails(song)"
                    [disabled]="song.title == null || song.title == ''"
                    class="no-underline text-green-500 bg-transparent border-none hover:text-green-700 pb-1 disabled:text-slate-500 disabled:cursor-not-allowed">
              <lucide-icon name="check" class="check pt-1"></lucide-icon>
            </button>
            <button *ngIf="editSongIndex === i" (click)="cancelEditSongDetails(song)"
                    class="no-underline text-red-500 bg-transparent border-none hover:text-red-700 pb-1">
              <lucide-icon name="x" class="x pt-1"></lucide-icon>
            </button>
            <button *ngIf="editSongIndex !== i" (click)="toggleDeleteSong(song)"
                    [hidden]="editSongIndex != null || this.editName == true"
                    class="no-underline border-none bg-transparent text-red-400 hover:text-red-700 invisible group-hover:visible">
              <lucide-icon name="minus-circle" class="minus-circle"></lucide-icon>
            </button>
          </div>
        </div>

        <div *ngIf="album.songs == null || album.songs.length == 0">
          <h3 class="p-5 mb-20 text-zinc-400">There are not songs in your album.</h3>
        </div>
      </div>
    </div>
  </main>
</div>

<div *ngIf="showDeleteModal" class="fixed inset-0 z-50 justify-center items-center flex">
  <div class="relative w-auto bg-sky-900 rounded-lg p-5">
    <h3 class="text-zinc-200">Are you sure that you want to delete this album?</h3>

    <div class="pt-8 flex items-center gap-2">
      <button (click)="deleteAlbum()"
              class="bg-sky-500 p-2 rounded-md border-none hover:bg-sky-700 w-20 disabled:bg-zinc-500 disabled:cursor-not-allowed"
              type="button">
        <div class="flex items-center justify-center text-zinc-200">
          <h4 class="text-zinc-200">Confirm</h4>
        </div>
      </button>
      <button (click)="toggleDeleteAlbum()" class="bg-red-500 p-2 rounded-md border-none hover:bg-red-700 w-20"
              type="button">
        <div class="flex items-center justify-center text-zinc-200">
          <h4 class="text-zinc-200">Cancel</h4>
        </div>
      </button>
    </div>
  </div>
</div>
<div *ngIf="showDeleteModal" class="opacity-50 fixed inset-0 z-40 bg-black"></div>

<div *ngIf="showDeleteSongModal" class="fixed inset-0 z-50 justify-center items-center flex">
  <div class="relative w-auto bg-sky-900 rounded-lg p-5">
    <h3 class="text-zinc-200">Are you sure that you want to delete this song?</h3>

    <div class="pt-8 flex items-center gap-2">
      <button (click)="deleteSong()"
              class="bg-sky-500 p-2 rounded-md border-none hover:bg-sky-700 w-20 disabled:bg-zinc-500 disabled:cursor-not-allowed"
              type="button">
        <div class="flex items-center justify-center text-zinc-200">
          <h4 class="text-zinc-200">Confirm</h4>
        </div>
      </button>
      <button (click)="toggleDeleteSong(null)" class="bg-red-500 p-2 rounded-md border-none hover:bg-red-700 w-20"
              type="button">
        <div class="flex items-center justify-center text-zinc-200">
          <h4 class="text-zinc-200">Cancel</h4>
        </div>
      </button>
    </div>
  </div>
</div>
<div *ngIf="showDeleteSongModal" class="opacity-50 fixed inset-0 z-40 bg-black"></div>

<div *ngIf="showAddSongModal" class="fixed inset-0 z-50 justify-center items-center flex">
  <div class="relative bg-sky-900 rounded-lg p-5">
    <h3 class="text-zinc-200">Add new Song</h3>

    <form class="pt-5">
      <div class="pt-5">
        <label class="block mb-2 text-sm font-medium text-zinc-200" for="file">Upload file</label>
        <input type="file" id="file" (change)="onChange($event)" multiple
               accept="audio/*, video/*, application/vnd.ms-powerpoint, application/vnd.openxmlformats-officedocument.presentationml.slideshow, application/vnd.openxmlformats-officedocument.presentationml.presentation"
               class="outline-none text-sm rounded-lg block w-full pt-2 pb-2 pl-2 bg-slate-900 border-none text-zinc-400 placeholder-zinc-400 text-white focus:ring-blue-500 focus:border-blue-500
                  file:cursor-pointer file:bg-sky-500 file:border-none file:rounded-md file:text-zinc-200 file:no-underline file:pr-4 file:pl-4 file:pt-1 file:pb-1 file:mr-2"
               placeholder="No file chosen">
      </div>
    </form>

    <div class="pt-8 flex items-center gap-2">
      <button (click)="addSong()" [disabled]="this.files == null || this.files.length == 0"
              class="bg-sky-500 p-2 rounded-md border-none disabled:bg-zinc-500 disabled:cursor-not-allowed hover:bg-sky-700 w-20"
              type="button">
        <div class="flex items-center justify-center text-zinc-200">
          <h4 class="text-zinc-200">Save</h4>
        </div>
      </button>
      <button (click)="toggleAddMusic()" class="bg-red-500 p-2 rounded-md border-none hover:bg-red-700 w-20"
              type="button">
        <div class="flex items-center justify-center text-zinc-200">
          <h4 class="text-zinc-200">Cancel</h4>
        </div>
      </button>
    </div>

    <div [hidden]="this.processing">
      <div class="flex flex-row pt-5">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="flex animate-spin h-5 w-5 mr-3 lucide lucide-loader-circle">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        <h3><strong>Processing...</strong></h3>
      </div>
    </div>

  </div>
</div>
<div *ngIf="showAddSongModal" class="opacity-50 fixed inset-0 z-40 bg-black"></div>

<div *ngIf="showEditCover" class="fixed inset-0 z-50 justify-center items-center flex">
  <div class="relative bg-sky-900 rounded-lg p-5">
    <h3 class="text-zinc-200">Select the new album cover</h3>

    <form class="pt-5">
      <div class="pt-5">
        <label class="block mb-2 text-sm font-medium text-zinc-200" for="file_cover">Upload file</label>
        <input type="file" id="file_cover" (change)="onChangeCover($event)"
               accept="image/*, application/vnd.ms-powerpoint, application/vnd.openxmlformats-officedocument.presentationml.slideshow, application/vnd.openxmlformats-officedocument.presentationml.presentation"
               class="outline-none text-sm rounded-lg block w-full pt-2 pb-2 pl-2 bg-slate-900 border-none text-zinc-400 placeholder-zinc-400 text-white focus:ring-blue-500 focus:border-blue-500
                  file:cursor-pointer file:bg-sky-500 file:border-none file:rounded-md file:text-zinc-200 file:no-underline file:pr-4 file:pl-4 file:pt-1 file:pb-1 file:mr-2"
               placeholder="No cover chosen">
      </div>
    </form>

    <div class="pt-8 flex items-center gap-2">
      <button (click)="editAlbumCover()" [disabled]="this.selectedCover == null || this.selectedCover.length == 0"
              class="bg-sky-500 p-2 rounded-md border-none disabled:bg-zinc-500 disabled:cursor-not-allowed hover:bg-sky-700 w-20"
              type="button">
        <div class="flex items-center justify-center text-zinc-200">
          <h4 class="text-zinc-200">Save</h4>
        </div>
      </button>
      <button (click)="toggleEditCover()" class="bg-red-500 p-2 rounded-md border-none hover:bg-red-700 w-20"
              type="button">
        <div class="flex items-center justify-center text-zinc-200">
          <h4 class="text-zinc-200">Cancel</h4>
        </div>
      </button>
    </div>

    <div [hidden]="this.processing">
      <div class="flex flex-row pt-5">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="flex animate-spin h-5 w-5 mr-3 lucide lucide-loader-circle">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        <h3><strong>Processing...</strong></h3>
      </div>
    </div>

  </div>
</div>
<div *ngIf="showEditCover" class="opacity-50 fixed inset-0 z-40 bg-black"></div>
